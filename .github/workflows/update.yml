name: Update news and rebuild pages

on:
  schedule:
    - cron: "17 1,13 * * *"   # twice a day: 01:17 and 13:17 UTC (about 6 PM and 6 AM Pacific)
  workflow_dispatch: {}        # lets you click "Run workflow" by hand

permissions:
  contents: write              # needed to commit the refreshed news.json and pages

concurrency:
  group: update-leakdeck
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the launch and rumor data
        run: python scripts/check_data.py

      - name: Fetch headlines from RSS feeds
        run: python scripts/update_news.py

      - name: Rebuild pages and sitemap
        run: python scripts/build_pages.py

      - name: Commit if anything changed
        run: |
          git config user.name "leakdeck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news and pages ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
